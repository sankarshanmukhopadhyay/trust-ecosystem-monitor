name: Collect and publish weekly ecosystem briefs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/collect-weekly.yml'
      - 'organizations/**'
      - 'trust_ecosystem_monitor/**'
  schedule:
    - cron: '30 21 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Restore generated observation state
        run: |
          git fetch origin generated-observations
          git checkout origin/generated-observations -- data docs
      - name: Collect TrustOverIP evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m trust_ecosystem_monitor collect
          --profile organizations/trustoverip/profile.toml
          --lookback-days 7
      - name: Collect DIF evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m trust_ecosystem_monitor collect
          --profile organizations/decentralized-identity/profile.toml
          --lookback-days 7
      - name: Collect W3C trust-standards evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m trust_ecosystem_monitor collect
          --profile organizations/w3c/profile.toml
          --lookback-days 7
      - name: Render governed scope registers
        run: >-
          python -m trust_ecosystem_monitor.scope
          docs/trustoverip
          docs/decentralized-identity
          docs/w3c
      - name: Render ecosystem catalog
        run: python -m trust_ecosystem_monitor site
      - name: Validate current generated state
        run: python -m trust_ecosystem_monitor validate --require-generated
      - name: Persist generated observation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin generated-observations
          git add data docs
          tree=$(git write-tree)
          parent=$(git rev-parse origin/generated-observations)
          parent_tree=$(git rev-parse "${parent}^{tree}")
          if [ "$tree" != "$parent_tree" ]; then
            commit=$(printf '%s\n' "chore(monitor): update weekly ecosystem observations" | git commit-tree "$tree" -p "$parent")
            git push origin "$commit:refs/heads/generated-observations"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
