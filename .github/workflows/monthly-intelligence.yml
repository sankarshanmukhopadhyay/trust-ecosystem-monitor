name: Publish completed-month ToIP intelligence

on:
  workflow_dispatch:
  schedule:
    # 02:40 UTC on day 2, after previous month has closed.
    - cron: '40 2 2 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate implementation
        run: python -m unittest discover -s tests
      - name: Resolve previous completed UTC month
        run: |
          MONTH="$(python -c 'from trust_ecosystem_monitor.monthly import previous_completed_month; print(previous_completed_month())')"
          echo "MONTH=$MONTH" >> "$GITHUB_ENV"
          echo "Scheduled collection month: $MONTH"
      - name: Collect bounded historical GitHub evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m trust_ecosystem_monitor.monthly --org trustoverip --month "$MONTH" --output monthly-prototype \
            --max-pages 25 \
            --prefix dtgwg- --prefix tswg- --prefix aimwg- --prefix ctwg- --prefix egwg-
      - name: Restore generated site
        run: |
          git fetch origin generated-observations
          git checkout origin/generated-observations -- docs
      - name: Update cumulative calendar-year intelligence
        run: |
          python -m trust_ecosystem_monitor.toip_annual \
            --month "$MONTH" --github-dir monthly-prototype --site docs/intelligence/toip
      - name: Publish ToIP CY data-contract assets
        run: |
          year="${MONTH%%-*}"
          data_dir="docs/intelligence/toip/${year}/data"
          mkdir -p "$data_dir"
          cp trust_ecosystem_monitor/toip_cy_data_contract/schema.json "$data_dir/schema.json"
          cp trust_ecosystem_monitor/toip_cy_data_contract/README.md "$data_dir/README.md"
      - name: Converge public ToIP intelligence navigation
        run: python -m trust_ecosystem_monitor.toip_navigation --site docs
      - name: Validate staged monthly page
        run: |
          test -s "docs/intelligence/toip/${MONTH%-*}/index.html"
          test -s "docs/intelligence/toip/${MONTH%-*}/data/manifest.json"
          test -s "docs/intelligence/toip/${MONTH%-*}/data/schema.json"
          test -s "docs/intelligence/toip/${MONTH%-*}/data/README.md"
          python -m trust_ecosystem_monitor.toip_publication_readiness --site docs
      - name: Retain validated monthly site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin generated-observations
          parent=$(git rev-parse origin/generated-observations)
          git read-tree "$parent"
          git add -A -- docs
          tree=$(git write-tree)
          if [ "$tree" != "$(git rev-parse "${parent}^{tree}")" ]; then
            commit=$(printf '%s\n' "chore(monitor): completed-month intelligence $MONTH" | git commit-tree "$tree" -p "$parent")
            git push --force-with-lease=refs/heads/generated-observations:$parent origin "$commit:refs/heads/generated-observations"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: toip-completed-month-intelligence
          path: |
            docs/intelligence/toip/
            monthly-prototype/
          retention-days: 30
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy TEM and monthly intelligence
        id: deployment
        uses: actions/deploy-pages@v5
