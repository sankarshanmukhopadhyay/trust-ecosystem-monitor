name: Backfill ToIP CY GitHub-only intelligence

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: "Inclusive start month, YYYY-MM"
        required: true
        default: "2026-01"
      end_month:
        description: "Inclusive end month, YYYY-MM. Leave default for current CY backfill target."
        required: true
        default: "2026-09"
      force:
        description: "Reprocess months already present in the annual manifest"
        type: boolean
        required: true
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate implementation
        run: python -m unittest discover -s tests
      - name: Restore generated site
        run: |
          git fetch origin generated-observations
          git checkout origin/generated-observations -- docs
      - name: Backfill missing CY months with GitHub-only evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(
            --org trustoverip
            --start "${{ inputs.start_month }}"
            --end "${{ inputs.end_month }}"
            --github-dir monthly-prototype
            --site docs/intelligence/toip
            --summary monthly-prototype/cy-backfill-summary.json
            --prefix dtgwg-
            --prefix tswg-
            --prefix aimwg-
            --prefix ctwg-
            --prefix egwg-
          )
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          python -m trust_ecosystem_monitor.toip_cy_backfill "${args[@]}"
      - name: Converge public ToIP intelligence navigation
        run: python -m trust_ecosystem_monitor.toip_navigation --site docs
      - name: Validate Pages publication readiness
        run: python -m trust_ecosystem_monitor.toip_publication_readiness --site docs
      - name: Persist validated CY backfill output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin generated-observations
          parent=$(git rev-parse origin/generated-observations)
          git read-tree "$parent"
          git add -A -- docs
          tree=$(git write-tree)
          parent_tree=$(git rev-parse "${parent}^{tree}")
          if [ "$tree" != "$parent_tree" ]; then
            commit=$(printf '%s\n' "chore(ToIP): backfill CY GitHub-only annual intelligence" | git commit-tree "$tree" -p "$parent")
            git push origin "$commit:refs/heads/generated-observations"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: toip-cy-github-only-backfill
          path: |
            docs/intelligence/toip/
            monthly-prototype/
          retention-days: 30
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy CY GitHub-only intelligence
        id: deployment
        uses: actions/deploy-pages@v5
