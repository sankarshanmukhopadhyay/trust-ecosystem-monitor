name: Verify public Pages routes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public Pages routes render
        shell: bash
        run: |
          set -euo pipefail
          base="https://sankarshanmukhopadhyay.github.io/trust-ecosystem-monitor"
          tmp="$(mktemp -d)"

          check_route() {
            local route="$1"
            local expect="$2"
            local label="$3"
            local output="$tmp/${label}.html"
            local status
            status="$(curl --location --silent --show-error --fail --max-time 30 --write-out '%{http_code}' --output "$output" "$base$route")"
            test "$status" = "200"
            test -s "$output"
            grep -Fq "$expect" "$output"
            echo "ok $route contains: $expect"
          }

          check_route "/intelligence/" "Trust Ecosystem Monitor" "intelligence"
          check_route "/intelligence/toip/" "ToIP" "toip"
          check_route "/intelligence/toip/2026/" "ToIP calendar-year intelligence" "toip-2026"
          check_route "/intelligence/toip/coverage/" "Coverage" "toip-coverage"
          check_route "/intelligence/toip/methodology/" "Methodology" "toip-methodology"
          check_route "/trustoverip/index.html" "Trust Over IP" "trustoverip"
          check_route "/monthly/" "Trust Ecosystem Monitor" "monthly"

      - name: Verify machine-ingestion data routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://sankarshanmukhopadhyay.github.io/trust-ecosystem-monitor"
          tmp="$(mktemp -d)"

          curl --location --silent --show-error --fail --max-time 30 \
            --output "$tmp/manifest.json" \
            "$base/intelligence/toip/2026/data/manifest.json"
          grep -Fq '"schema"' "$tmp/manifest.json"
          grep -Fq 'tem-cy-intelligence-v1' "$tmp/manifest.json"

          # These static data-contract assets are published by the next monthly/backfill run after PR #135.
          # Until then, they remain source-controlled on main and are not deployment blockers for #81.
          echo "machine-ingestion manifest route is reachable"
