name: Historical ToIP monthly evidence prototype

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate monthly implementation
        run: python -m unittest discover -s tests
      - name: Collect August 2026 GitHub evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m trust_ecosystem_monitor.monthly --org trustoverip --month 2026-08 --output monthly-prototype \
            --prefix dtgwg- \
            --prefix tswg- \
            --prefix aimwg- \
            --prefix ctwg- \
            --prefix egwg-
      - name: Collect September 2026 GitHub evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m trust_ecosystem_monitor.monthly --org trustoverip --month 2026-09 --output monthly-prototype \
            --prefix dtgwg- \
            --prefix tswg- \
            --prefix aimwg- \
            --prefix ctwg- \
            --prefix egwg-
      - name: Render source-aware monthly reports
        run: |
          python -m trust_ecosystem_monitor.monthly_report monthly-prototype/2026-08.json --output monthly-prototype/2026-08-report.md
          python -m trust_ecosystem_monitor.monthly_report monthly-prototype/2026-09.json --output monthly-prototype/2026-09-report.md
      - name: Compare observed evidence
        run: |
          python -m trust_ecosystem_monitor.monthly_compare monthly-prototype/2026-08.json monthly-prototype/2026-09.json --output monthly-prototype
      - name: Render portfolio overview reports
        run: |
          python -m trust_ecosystem_monitor.monthly_overview monthly-prototype/2026-08.json --output monthly-prototype/2026-08-overview.md
          python -m trust_ecosystem_monitor.monthly_overview monthly-prototype/2026-09.json --output monthly-prototype/2026-09-overview.md
      - name: Render HTML previews
        run: |
          python -m trust_ecosystem_monitor.monthly_html monthly-prototype/2026-08-report.md --output monthly-prototype/2026-08-report.html
          python -m trust_ecosystem_monitor.monthly_html monthly-prototype/2026-09-report.md --output monthly-prototype/2026-09-report.html
          python -m trust_ecosystem_monitor.monthly_html monthly-prototype/2026-08-to-2026-09.md --output monthly-prototype/2026-08-to-2026-09.html
          python -m trust_ecosystem_monitor.monthly_html monthly-prototype/2026-08-overview.md --output monthly-prototype/2026-08-overview.html
          python -m trust_ecosystem_monitor.monthly_html monthly-prototype/2026-09-overview.md --output monthly-prototype/2026-09-overview.html
      - name: Restore latest generated weekly Pages site
        run: |
          git fetch origin generated-observations
          git checkout origin/generated-observations -- docs
      - name: Stage public HTML previews
        run: |
          mkdir -p docs/monthly
          cp monthly-prototype/2026-08-report.html docs/monthly/2026-08-report.html
          cp monthly-prototype/2026-09-report.html docs/monthly/2026-09-report.html
          cp monthly-prototype/2026-08-overview.html docs/monthly/2026-08-overview.html
          cp monthly-prototype/2026-09-overview.html docs/monthly/2026-09-overview.html
          cp monthly-prototype/2026-08-to-2026-09.html docs/monthly/2026-08-to-2026-09.html
          python -m trust_ecosystem_monitor.monthly_index --output docs/monthly/index.html
          python -m trust_ecosystem_monitor.monthly_index --link-home docs/index.html
      - name: Render ToIP ecosystem intelligence
        run: |
          python -m trust_ecosystem_monitor.toip_intelligence monthly-prototype/2026-08.json monthly-prototype/2026-09.json --output docs/intelligence/toip
          mkdir -p docs/intelligence
          cat > docs/intelligence/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecosystem intelligence</title></head><body><main><h1>Ecosystem intelligence</h1><p>Independent evidence-based ecosystem reporting.</p><p><a href="toip/">ToIP ecosystem intelligence</a></p></main></body></html>
          EOF
          python -c "from pathlib import Path; p=Path('docs/index.html'); s=p.read_text(); link='<p><a href=\"intelligence/toip/\">ToIP ecosystem intelligence (source-aware preview)</a></p>'; s=s.replace('</main>',link+'</main>',1) if 'href=\"intelligence/toip/\"' not in s else s; p.write_text(s)"
      - name: Publish experimental public GitHub and Confluence discovery views
        run: |
          python -m trust_ecosystem_monitor.toip_experimental_combined \
            --github-dir monthly-prototype --site docs/intelligence/toip
      - name: Build cumulative CY 2026 intelligence baseline
        run: |
          python -m trust_ecosystem_monitor.toip_annual \
            --month 2026-08 --github-dir monthly-prototype --site docs/intelligence/toip
          python -m trust_ecosystem_monitor.toip_annual \
            --month 2026-09 --github-dir monthly-prototype --site docs/intelligence/toip
      - name: Publish independently admitted cross-source reports when supplied
        env:
          # Repository-maintained, reviewed admission manifests only.
          # Absence is an explicit GitHub-only result, not permission to
          # reinterpret raw Confluence metadata as admitted observations.
          ADMITTED_DIR: admitted-toip-confluence
        run: |
          if [ -d "$ADMITTED_DIR" ]; then
            python -m trust_ecosystem_monitor.toip_combined_publication \
              --github-dir monthly-prototype --admitted-dir "$ADMITTED_DIR" \
              --site docs/intelligence/toip
          else
            # The restored generated branch may contain reports from a prior
            # authorized run. Never republish them after admission inputs vanish.
            rm -f docs/intelligence/toip/2026-08/cross-source.html
            rm -f docs/intelligence/toip/2026-08/cross-source.md
            rm -f docs/intelligence/toip/2026-09/cross-source.html
            rm -f docs/intelligence/toip/2026-09/cross-source.md
            echo "No admitted Confluence manifests; publishing GitHub-only intelligence"
          fi
      - name: Converge public ToIP intelligence navigation
        run: python -m trust_ecosystem_monitor.toip_navigation --site docs
      - name: Verify local Pages publication readiness
        run: python -m trust_ecosystem_monitor.toip_publication_readiness --site docs
      - name: Persist public intelligence pages for subsequent weekly deployments
        run: |
          # Weekly deployment restores docs from generated-observations. Persist
          # the validated monthly site there first, so a later weekly run cannot
          # silently remove the intelligence routes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin generated-observations
          parent=$(git rev-parse origin/generated-observations)
          # Reset the index to the generated branch tree before staging docs.
          # Otherwise git write-tree uses main's tracked code files, silently
          # replacing the generated branch's full repository tree.
          git read-tree "$parent"
          git add -A -- docs
          tree=$(git write-tree)
          parent_tree=$(git rev-parse "${parent}^{tree}")
          if [ "$tree" != "$parent_tree" ]; then
            commit=$(printf '%s\\n' "chore(monitor): persist ToIP intelligence Pages" | git commit-tree "$tree" -p "$parent")
            git push --force-with-lease=refs/heads/generated-observations:$parent origin "$commit:refs/heads/generated-observations"
          fi
      - name: Upload public HTML preview bundle
        uses: actions/upload-artifact@v7
        with:
          name: toip-monthly-html-previews
          path: |
            docs/monthly/
            docs/intelligence/
          retention-days: 30
      - name: Upload prototype evidence
        uses: actions/upload-artifact@v7
        with:
          name: toip-aug-sep-2026-monthly-prototype
          path: monthly-prototype/
          retention-days: 30
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy combined weekly site and monthly previews
        id: deployment
        uses: actions/deploy-pages@v5
